<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松本のおすすめ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #f5f0eb; padding: 20px; min-height: 100vh; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: #888; font-size: 14px; text-decoration: none; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #1a1a2e; text-align: center; margin-bottom: 6px; font-weight: 700; }
    .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; line-height: 1.6; }
    .cat-label { font-size: 13px; font-weight: 700; color: #c8a97e; letter-spacing: 0.06em; margin: 4px 4px 10px; }
    .card { background: white; border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 16px; text-decoration: none; color: inherit; }
    .card:active { opacity: 0.7; }
    .card-icon { font-size: 26px; min-width: 38px; text-align: center; }
    .num { min-width: 30px; height: 30px; border-radius: 50%; background: #c8a97e; color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .reason-lead { font-size: 12px; color: #999; line-height: 1.7; margin: 2px 4px 12px; }
    .card-body { flex: 1; }
    .card-title { font-size: 15px; font-weight: bold; color: #1a1a2e; line-height: 1.4; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #888; line-height: 1.6; }
    .arrow { color: #c8a97e; font-size: 18px; font-weight: 700; flex-shrink: 0; }
    .reason-bar { position: relative; }
    .badge { position: absolute; top: -7px; right: -7px; min-width: 24px; height: 24px; border-radius: 12px; background: #ff0000; color: #fff; font-size: 13px; font-weight: 700; display: none; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.25); }
    .soon { background: #faf6f0; border: 1px dashed #d8c4a8; border-radius: 14px; padding: 16px 18px; margin-top: 8px; }
    .soon-title { font-size: 13px; font-weight: 700; color: #b89968; margin-bottom: 6px; }
    .soon-text { font-size: 12px; color: #a08c6e; line-height: 1.7; }
  </style>
</head>
<body>
  <a href="javascript:history.back()" class="back">← 戻る</a>
  <h1>🛒 松本のおすすめ</h1>
  <p class="subtitle">「なぜ良いのか」で選んだ物だけ。<br>“これは要らない・安物で十分” も正直に言います。</p>

  <div class="cat-label">― おすすめの商品 ―</div>

  <a href="/protein.html" class="card">
    <div class="card-icon">💪</div>
    <div class="card-body">
      <div class="card-title">プロテイン</div>
      <div class="card-desc">溶けやすさ・お腹・コスパ。現場で見てきた選び方</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a href="/supple.html" class="card">
    <div class="card-icon">💊</div>
    <div class="card-body">
      <div class="card-title">サプリメント</div>
      <div class="card-desc">元・骨折予防研究者の視点で、本当に要る物だけ</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a href="/goods.html" class="card">
    <div class="card-icon">🏋️</div>
    <div class="card-body">
      <div class="card-title">トレーニンググッズ</div>
      <div class="card-desc">トレーニング・体のケアに本当に使える道具</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <div class="cat-label" style="margin-top:26px;">― 読む ―</div>

  <a href="/reasons.html" class="card reason-bar">
    <span class="badge" id="reasonBadge"></span>
    <div class="card-icon">📖</div>
    <div class="card-body">
      <div class="card-title">おすすめの理由</div>
      <div class="card-desc">「なぜそれが良いのか」を深掘りした記事一覧。買う前に読む話</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <a href="/shitte.html" class="card reason-bar">
    <span class="badge" id="shitteBadge"></span>
    <div class="card-icon">💡</div>
    <div class="card-body">
      <div class="card-title">知って欲しいこと</div>
      <div class="card-desc">体づくりの前に、松本が知っておいてほしい話</div>
    </div>
    <div class="arrow">→</div>
  </a>

  <script>
    (function(){
      function countUnread(slugs, key){
        var read = {};
        try { read = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e){}
        return slugs.filter(function(s){ return !read[s]; }).length;
      }
      function setBadge(id, n){
        var b = document.getElementById(id);
        if (!b) return;
        if (n > 0) { b.textContent = n; b.style.display = 'flex'; }
        else { b.style.display = 'none'; }
      }
      var REASON_SLUGS = ['bone','magnesium','inulin','water','protein-heat','omega','oil','mct','urabanashi','stretchpole','imuse','suihanki','mitochondria','coq10','hazakai','iron','explosion','cinnamon','gluten','lactose','protein-belly','carbcut','kinousei','caffeine'];
      var SHITTE_SLUGS = ['seitai','yaseta-mizu'];
      function update(){
        setBadge('reasonBadge', countUnread(REASON_SLUGS, 'putters_reasons_read'));
        setBadge('shitteBadge', countUnread(SHITTE_SLUGS, 'putters_shitte_read'));
      }
      update();
      window.addEventListener('pageshow', update);
    })();
  </script>
</body>
</html>

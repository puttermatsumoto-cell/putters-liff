<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💡 アイデアメモ</title>
  <link rel="apple-touch-icon" href="/idea-icon.png">
  <link rel="icon" type="image/png" href="/idea-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #f5f0eb; padding: 20px; min-height: 100vh; padding-bottom: 100px; }
    .back { display: inline-flex; align-items: center; gap: 6px; color: #888; font-size: 14px; text-decoration: none; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #222; text-align: center; margin-bottom: 20px; padding-top: 12px; }
    .section { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .input-area { width: 100%; min-height: 120px; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; line-height: 1.6; resize: vertical; font-family: inherit; }
    .input-area:focus { outline: none; border-color: #c8a97e; }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    .btn-mic { flex: 1; padding: 14px; background: #f5f0eb; color: #c8a97e; border: 1.5px solid #c8a97e; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-mic.recording { background: #c8a97e; color: white; }
    .btn-save { flex: 2; padding: 14px; background: #1a1a2e; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-save:disabled { background: #ccc; }
    .idea-item { padding: 14px; border-left: 3px solid #c8a97e; background: #fafafa; border-radius: 6px; margin-bottom: 10px; }
    .idea-date { font-size: 11px; color: #888; margin-bottom: 6px; }
    .idea-text { font-size: 14px; line-height: 1.6; color: #333; white-space: pre-wrap; }
    .empty { text-align: center; color: #aaa; font-size: 13px; padding: 20px 0; }
    #toast { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #c8a97e; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 999; }
  </style>
</head>
<body>
  <a href="/" class="back">← 戻る</a>
  <h1>💡 アイデアメモ</h1>

  <div class="section">
    <textarea id="idea-input" class="input-area" placeholder="思いついたことを書く..."></textarea>
    <div class="btn-row">
      <button id="btn-mic" class="btn-mic" onclick="toggleVoice()">🎤 音声入力</button>
      <button id="btn-save" class="btn-save" onclick="saveIdea()">保存</button>
    </div>
  </div>

  <div class="section">
    <h2 style="font-size:14px; color:#555; margin-bottom:12px;">📋 最近のアイデア</h2>
    <div id="ideas-list">
      <div class="empty">読み込み中...</div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwnDYL8RT3pFxetCwig3LtDIatUvruamQrGF2B99zPVDfVBeN6KgtZobpLFj2T8ZQfe/exec';
    const NAME = localStorage.getItem('putters_user_name') || '';

    // 松本大樹以外はリダイレクト
    if (NAME !== '松本大樹') {
      alert('この機能は松本大樹専用です');
      location.href = '/';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    async function saveIdea() {
      const text = document.getElementById('idea-input').value.trim();
      if (!text) { alert('内容を入力してください'); return; }
      const btn = document.getElementById('btn-save');
      btn.disabled = true;
      btn.textContent = '保存中...';
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveIdea', name: NAME, text })
        });
        document.getElementById('idea-input').value = '';
        showToast('💡 保存しました');
        loadIdeas();
      } catch (e) {
        alert('保存に失敗しました');
      }
      btn.disabled = false;
      btn.textContent = '保存';
    }

    async function loadIdeas() {
      try {
        const res = await fetch(GAS_URL + '?action=getIdeas&name=' + encodeURIComponent(NAME));
        const data = await res.json();
        const list = document.getElementById('ideas-list');
        if (!data.ideas || data.ideas.length === 0) {
          list.innerHTML = '<div class="empty">まだメモがありません</div>';
          return;
        }
        list.innerHTML = data.ideas.slice(0, 30).map(i => `
          <div class="idea-item">
            <div class="idea-date">${i.date}</div>
            <div class="idea-text">${escapeHtml(i.text)}</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('ideas-list').innerHTML = '<div class="empty">読み込みに失敗しました</div>';
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 音声入力（Web Speech API）
    let recognition = null;
    let isRecording = false;

    function toggleVoice() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('このブラウザは音声入力に対応していません');
        return;
      }
      const btn = document.getElementById('btn-mic');
      if (isRecording) {
        recognition.stop();
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onstart = () => {
        isRecording = true;
        btn.classList.add('recording');
        btn.textContent = '🎤 停止';
      };
      recognition.onresult = (e) => {
        const input = document.getElementById('idea-input');
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            input.value += e.results[i][0].transcript;
          }
        }
      };
      recognition.onerror = (e) => console.error('音声認識エラー', e);
      recognition.onend = () => {
        isRecording = false;
        btn.classList.remove('recording');
        btn.textContent = '🎤 音声入力';
      };
      recognition.start();
    }

    loadIdeas();
  </script>
</body>
</html>

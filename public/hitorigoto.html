<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松本の独り言｜PUTTERS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root{
      --bg:#f7f4ef; --card:#ffffff; --ink:#23222a; --sub:#8b8578;
      --accent:#c8a97e; --accent-deep:#b08d5b; --strong:#b5532e; --line:#ece4d8;
    }
    body { font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; padding:0 0 60px; min-height:100vh; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 0 20px; }
    .back { display:inline-flex; align-items:center; gap:6px; color:var(--sub); font-size:13px; text-decoration:none; background:none; border:none; cursor:pointer; padding:0; font-family:inherit; }

    /* ── サイトヘッダー ── */
    .site-head { text-align:center; padding:38px 0 26px; }
    .brand { font-family:Georgia,'Times New Roman',serif; font-size:12px; letter-spacing:0.32em; color:var(--accent-deep); font-weight:700; text-transform:uppercase; }
    .brand-rule { width:26px; height:1px; background:var(--accent); margin:12px auto; opacity:.7; }
    h1.page { font-size:25px; color:var(--ink); font-weight:800; letter-spacing:.02em; }
    .subtitle { font-size:12.5px; color:var(--sub); margin-top:12px; line-height:1.9; }

    /* ── 一覧カード ── */
    #list { padding-top:6px; }
    .card { display:block; background:var(--card); border-radius:18px; overflow:hidden; margin-bottom:16px; box-shadow:0 6px 22px rgba(60,45,25,.06); border:1px solid rgba(200,169,126,.14); text-decoration:none; color:inherit; transition:transform .15s ease, box-shadow .15s ease; }
    .card:active { transform:scale(.985); box-shadow:0 3px 12px rgba(60,45,25,.08); }
    .card-thumb { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#efe8dd; }
    .card-body { padding:17px 19px 18px; }
    .card-date { font-family:Georgia,serif; font-size:12px; color:var(--accent-deep); font-weight:700; letter-spacing:.05em; margin-bottom:8px; }
    .card-title { font-size:17.5px; font-weight:800; color:var(--ink); line-height:1.5; letter-spacing:.01em; }
    .card-excerpt { font-size:13px; color:var(--sub); line-height:1.75; margin-top:9px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card-cta { font-size:12px; color:var(--accent-deep); font-weight:700; margin-top:13px; letter-spacing:.04em; }
    .empty { background:var(--card); border-radius:16px; padding:28px; text-align:center; color:var(--sub); font-size:13px; }

    /* ── 記事本文 ── */
    .article { display:none; padding-top:20px; }
    .art-head { text-align:center; padding:6px 0 26px; border-bottom:1px solid var(--line); margin-bottom:28px; }
    .art-date { font-family:Georgia,serif; font-size:12.5px; color:var(--accent-deep); font-weight:700; letter-spacing:.08em; margin-bottom:12px; }
    h1.art { font-size:24px; line-height:1.55; color:var(--ink); font-weight:800; letter-spacing:.01em; }
    .art-body p { font-size:15.5px; line-height:2.05; margin-bottom:19px; color:#38363f; }
    .art-body p:last-child { margin-bottom:0; }
    .art-body img { border-radius:14px; margin:6px auto 18px; box-shadow:0 4px 16px rgba(60,45,25,.1); }
    .em { background:linear-gradient(transparent 60%, #f4e3c4 60%); font-weight:700; padding:0 1px; }
    .strong { color:var(--strong); font-weight:700; }
    .sign { font-size:13px; color:var(--sub); text-align:right; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); letter-spacing:.04em; }
    .nav-foot { margin-top:26px; text-align:center; }
    .nav-foot button { background:none; border:1px solid var(--line); border-radius:999px; padding:11px 26px; color:var(--accent-deep); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; }
    .nav-foot button:active { background:#f0e8db; }
    .topbar { padding:18px 0 4px; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- 一覧ビュー -->
  <div id="list-view">
    <div class="topbar"><a href="javascript:history.back()" class="back">← 戻る</a></div>
    <div class="site-head">
      <div class="brand">PUTTERS Journal</div>
      <div class="brand-rule"></div>
      <h1 class="page">松本の独り言</h1>
      <p class="subtitle">いま考えてること、現場の裏側、本音。<br>答えじゃなくて、進行中の頭の中です。</p>
    </div>
    <div id="list"></div>
  </div>

  <!-- 本文ビュー -->
  <div id="article-view" class="article">
    <div class="topbar"><button class="back" onclick="showList()">← 独り言一覧に戻る</button></div>
    <div class="art-head">
      <div class="art-date" id="art-date"></div>
      <h1 class="art" id="art-title"></h1>
    </div>
    <div class="art-body" id="art-body"></div>
    <div class="sign">— 松本</div>
    <div class="nav-foot"><button onclick="showList()">← 一覧に戻る</button></div>
  </div>

</div>

<script src="/hitorigoto-data.js"></script>
<script>
  const listEl = document.getElementById('list');
  const listView = document.getElementById('list-view');
  const artView = document.getElementById('article-view');
  const SITE_TITLE = document.title;

  // 予約投稿：date（'YYYY.MM.DD'）が今日以前のものだけを、新しい順で公開。
  // 未来日付のエントリは、その日が来るまで一覧にも直リンクにも出ない＝先出しストック可。
  function hgKey(s){ const p = String(s).split('.').map(Number); return p[0]*10000 + p[1]*100 + p[2]; }
  const HG_TODAY = (function(){ const d = new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); })();
  const VISIBLE = (Array.isArray(HITORIGOTO) ? HITORIGOTO : [])
    .filter(e => hgKey(e.date) <= HG_TODAY)
    .sort((a, b) => hgKey(b.date) - hgKey(a.date));

  // body配列から最初の画像src（あれば）を取り出す＝カードのサムネ用。データは改変しない。
  function firstImage(body){
    for (const p of (body||[])) { const m = String(p).match(/<img[^>]+src=["']([^"']+)["']/i); if (m) return m[1]; }
    return null;
  }
  // body配列からタグを除いた最初の本文テキスト＝カードの抜粋用。
  function excerpt(body){
    for (const p of (body||[])) {
      const t = String(p).replace(/<[^>]+>/g,'').trim();
      if (t) return t;
    }
    return '';
  }

  function renderList() {
    if (VISIBLE.length === 0) {
      listEl.innerHTML = '<div class="empty">まだ独り言はありません。</div>';
      return;
    }
    listEl.innerHTML = VISIBLE.map(e => {
      const img = firstImage(e.body);
      const thumb = img ? `<img class="card-thumb" src="${img}" alt="" loading="lazy">` : '';
      return `
      <a class="card" href="?id=${e.id}" onclick="showArticle('${e.id}');return false;">
        ${thumb}
        <div class="card-body">
          <div class="card-date">${e.date}</div>
          <div class="card-title">${e.title}</div>
          <div class="card-excerpt">${excerpt(e.body)}</div>
          <div class="card-cta">続きを読む →</div>
        </div>
      </a>`;
    }).join('');
  }

  // 画面切替はJSの表示/非表示のみ。location.hash や history は一切触らない
  // → 「← 戻る」(history.back) が常に元のページ（ホーム等）に戻れる
  function showList() {
    artView.style.display = 'none';
    listView.style.display = 'block';
    document.title = SITE_TITLE;
    window.scrollTo(0, 0);
  }

  function showArticle(id) {
    const e = VISIBLE.find(x => x.id === id);
    if (!e) { showList(); return; }
    document.getElementById('art-date').textContent = e.date;
    document.getElementById('art-title').textContent = e.title;
    document.getElementById('art-body').innerHTML = e.body.map(p => `<p>${p}</p>`).join('');
    document.title = e.title + '｜松本の独り言';
    listView.style.display = 'none';
    artView.style.display = 'block';
    window.scrollTo(0, 0);
  }

  renderList();
  // 初期表示：?id= があればその本文、なければ一覧
  const _id = new URLSearchParams(location.search).get('id');
  if (_id) showArticle(_id);
  else showList();
</script>
</body>
</html>

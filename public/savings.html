<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>節約メモ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #f7f4f0; min-height: 100vh; padding: 24px 16px 40px; }

    .total-card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(26,26,46,0.2);
    }
    .total-label { font-size: 10px; color: #666; letter-spacing: 0.1em; margin-bottom: 4px; }
    .total-amount { font-size: 34px; font-weight: 900; color: white; line-height: 1; }
    .total-unit { font-size: 14px; color: #aaa; font-weight: 400; }
    .total-sub {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .total-sub-item { font-size: 12px; color: #666; }
    .total-sub-item span { color: #c8a97e; font-weight: 700; }

    .month-nav {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    }
    .month-nav button { background: none; border: none; font-size: 24px; color: #1a1a2e; cursor: pointer; padding: 4px 12px; opacity: 0.4; }
    .month-nav button:disabled { opacity: 0.15; cursor: default; }
    .month-nav span { font-size: 17px; font-weight: 700; color: #1a1a2e; }

    .cal-wrap { background: white; border-radius: 18px; padding: 14px 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .cal-headers { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
    .cal-headers span { text-align: center; font-size: 11px; color: #bbb; font-weight: 600; padding: 4px 0; }
    .cal-headers span:first-child { color: #e57373; }
    .cal-headers span:last-child { color: #5b8fe8; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

    .cal-day {
      border-radius: 10px;
      padding: 5px 2px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .cal-day.empty { visibility: hidden; }
    .day-num {
      font-size: 12px;
      font-weight: 600;
      color: #1a1a2e;
      line-height: 1;
    }
    .day-num.dim { color: #aaa; font-weight: 400; }
    .day-btns { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .day-btn {
      border: none;
      border-radius: 8px;
      font-size: 17px;
      padding: 10px 0;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      background: #f0f0f0;
    }
    .day-btn.on { color: white; }
    .day-btn.coffee.on { background: #795548; }
    .day-btn.bento.on { background: #2e7d32; }
    .day-btn.bike.on { background: #1565c0; }
    .day-btn:active { transform: scale(0.92); }

    .legend {
      display: flex; gap: 16px; justify-content: center; margin-top: 14px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  </style>
</head>
<body>

  <div class="total-card">
    <div>
      <div class="total-label">今月の節約合計</div>
      <div class="total-amount"><span id="total-yen">0</span><span class="total-unit"> 円</span></div>
    </div>
    <div class="total-sub">
      <div class="total-sub-item">☕ <span id="sub-coffee">0</span>円</div>
      <div class="total-sub-item">🍱 <span id="sub-bento">0</span>円</div>
      <div class="total-sub-item">🚲 <span id="sub-bike">0</span>円</div>
    </div>
  </div>

  <div class="month-nav">
    <button id="btn-prev" onclick="changeMonth(-1)">‹</button>
    <span id="month-label"></span>
    <button id="btn-next" onclick="changeMonth(1)">›</button>
  </div>

  <div class="cal-wrap">
    <div class="cal-headers">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#795548"></div>コーヒー +300円</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2e7d32"></div>弁当 +430円</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div>自転車 +35円/往復（長押しでリセット）</div>
  </div>

<script>
  const ITEMS = {
    coffee: { label: '☕', save: 300, cls: 'coffee' },
    bento:  { label: '🍱', save: 430, cls: 'bento'  },
    bike:   { label: '🚲', save: 35,  cls: 'bike'   }
  };
  const STORE_KEY = 'savings_data2';

  const today = new Date();
  let year = today.getFullYear();
  let month = today.getMonth();

  function getData() { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  function setData(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }
  function ds(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

  function toggle(dateStr, type) {
    const d = getData();
    if (!d[dateStr]) d[dateStr] = {};
    if (type === 'bike') {
      // 自転車は回数カウント（タップで+1、長押しでリセット）
      d[dateStr][type] = (d[dateStr][type] || 0) + 1;
    } else {
      if (d[dateStr][type]) delete d[dateStr][type];
      else d[dateStr][type] = true;
    }
    if (Object.keys(d[dateStr]).length === 0) delete d[dateStr];
    setData(d);
    render();
  }

  function resetBike(dateStr) {
    const d = getData();
    if (d[dateStr]) { delete d[dateStr]['bike']; if (Object.keys(d[dateStr]).length === 0) delete d[dateStr]; }
    setData(d);
    render();
  }

  function changeMonth(delta) {
    month += delta;
    if (month > 11) { month = 0; year++; }
    if (month < 0) { month = 11; year--; }
    updateNavBtns();
    render();
  }

  function updateNavBtns() {
    const isNow = year === today.getFullYear() && month === today.getMonth();
    document.getElementById('btn-next').disabled = isNow;
    document.getElementById('btn-prev').disabled =
      year < today.getFullYear() - 1 || (year === today.getFullYear() && month <= today.getMonth() - 3);
  }

  function render() {
    document.getElementById('month-label').textContent = `${year}年${month+1}月`;
    const data = getData();
    const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
    const todayDs = ds(today.getFullYear(), today.getMonth(), today.getDate());

    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    const firstDow = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDow; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    let coffeeTotal = 0, bentoTotal = 0, bikeTotal = 0;

    for (let d = 1; d <= days; d++) {
      const dateStr = ds(year, month, d);
      const rec = data[dateStr] || {};
      const isFuture = dateStr > todayDs;

      // 今月は未来も押せる / 過去月は全部押せる
      const disabled = false;

      const el = document.createElement('div');
      el.className = 'cal-day';

      const numEl = document.createElement('div');
      const isToday = dateStr === todayDs;
      numEl.className = 'day-num' + (isToday ? '' : ' dim');
      numEl.textContent = d;
      el.appendChild(numEl);

      const btns = document.createElement('div');
      btns.className = 'day-btns';

      for (const [type, item] of Object.entries(ITEMS)) {
        const val = rec[type];
        const isOn = type === 'bike' ? (val > 0) : !!val;
        if (isOn) {
          if (type === 'coffee') coffeeTotal += item.save;
          else if (type === 'bento') bentoTotal += item.save;
          else if (type === 'bike') bikeTotal += item.save * val;
        }
        const btn = document.createElement('button');
        btn.className = 'day-btn ' + item.cls + (isOn ? ' on' : '');
        btn.textContent = type === 'bike' && val > 0 ? `🚲×${val}` : item.label;
        btn.onclick = () => toggle(dateStr, type);
        if (type === 'bike') btn.oncontextmenu = (e) => { e.preventDefault(); resetBike(dateStr); };
        btns.appendChild(btn);
      }

      el.appendChild(btns);
      grid.appendChild(el);
    }

    document.getElementById('total-yen').textContent = (coffeeTotal + bentoTotal + bikeTotal).toLocaleString();
    document.getElementById('sub-coffee').textContent = coffeeTotal.toLocaleString();
    document.getElementById('sub-bento').textContent = bentoTotal.toLocaleString();
    document.getElementById('sub-bike').textContent = bikeTotal.toLocaleString();
  }

  updateNavBtns();
  render();
</script>
</body>
</html>

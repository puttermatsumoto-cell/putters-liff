<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジム体重を入れる</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #f5f0eb; padding: 20px; }
    .back { display: inline-flex; color: #888; font-size: 14px; text-decoration: none; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #222; text-align: center; margin-bottom: 4px; }
    .sub { text-align: center; color: #888; font-size: 12px; margin-bottom: 20px; }
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .who { font-size: 13px; color: #888; margin-bottom: 4px; }
    .name { font-size: 26px; font-weight: bold; color: #1a1a2e; margin-bottom: 4px; }
    .name.none { font-size: 16px; color: #c62828; font-weight: normal; }
    .at { font-size: 12px; color: #aaa; }
    input, select { width: 100%; padding: 14px; font-size: 20px; border: 1px solid #ddd; border-radius: 10px; margin-top: 10px; }
    input[type=number] { font-size: 28px; text-align: center; font-weight: bold; }
    button { width: 100%; padding: 16px; background: #1a1a2e; color: #c8a97e; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 12px; }
    button:disabled { opacity: .4; }
    .msg { text-align: center; padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 14px; display: none; }
    .ok { background: #e8f5e9; color: #2e7d32; }
    .ng { background: #fdecea; color: #c62828; }
    .hint { color: #888; font-size: 12px; line-height: 1.8; margin-top: 10px; }
    .recent { font-size: 13px; color: #555; line-height: 2; }
    .auto { background: #f7f4f0; border-radius: 10px; padding: 14px; margin-top: 10px; text-align: center; }
    .autolabel { font-size: 12px; color: #888; }
    .autoval { font-size: 32px; font-weight: bold; color: #1a1a2e; margin: 4px 0; }
    .autoval.waiting { font-size: 15px; font-weight: normal; color: #c62828; }
    .link { width: auto; display: inline-block; padding: 6px 12px; margin: 4px 4px 0; background: none;
            color: #888; font-size: 12px; font-weight: normal; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <a href="/admin.html" class="back">← 管理画面</a>
  <h1>📏 ウエストを入れる</h1>
  <div class="sub">体重は体重計から自動で入ります</div>

  <div class="card">
    <div class="who">いまの時間の予約</div>
    <div class="name" id="who">確認中…</div>
    <div class="at" id="at"></div>

    <!-- 予約から自動で決まるが、違う人・別の日にも入れられるようにしておく -->
    <!-- 予約から自動で入るが、外れた時のために宿題シートの名前から選べるようにしておく -->
    <input type="text" id="name" list="names" placeholder="名前（自動で入ります）">
    <datalist id="names"></datalist>
    <input type="date" id="date">

    <!-- 体重＝体重計から入った値を見せるだけ。届いていない時だけ手で打てるように開く -->
    <div class="auto" id="autobox">
      <div class="autolabel" id="autolabel">今日の体重</div>
      <div class="autoval" id="autoval">確認中…</div>
      <button type="button" class="link" id="reload">読み直す</button>
    </div>
    <!-- ★体重の欄は絶対に隠さない。体重計・Wi-Fi・ラズパイのどれが落ちても、
         ここに打てば今までどおり記録できる。自動は上乗せであって、置き換えではない -->
    <input type="number" id="weight" inputmode="decimal" step="0.05" placeholder="体重 kg（手で入れる時）">

    <input type="number" id="waist" inputmode="decimal" step="0.1" placeholder="ウエスト cm">
    <button id="save">保存する</button>
    <div class="msg" id="msg"></div>
    <div class="hint">
      体重は乗るだけで入ります。届いていれば上に出るので、打つのはウエストだけ。<br>
      <b>届いていない時は体重の欄に打てば、今までどおり記録されます。</b><br>
      同じ人の同じ日に入れ直すと、上書きされます。
    </div>
  </div>

  <div class="card">
    <div class="who" style="margin-bottom:8px;">直近に入れた分</div>
    <div class="recent" id="recent">—</div>
  </div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwnDYL8RT3pFxetCwig3LtDIatUvruamQrGF2B99zPVDfVBeN6KgtZobpLFj2T8ZQfe/exec';
  const pad = n => String(n).padStart(2, '0');
  const now = () => new Date();
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const stamp = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes());

  // いま誰の枠か＝体重計が自動でやるはずだった判定を、そのまま使う
  async function whoNow() {
    const d = now();
    document.getElementById('date').value = ymd(d);
    document.getElementById('at').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' 時点';
    try {
      const r = await (await fetch(GAS_URL + '?action=hp_name_at&at=' + stamp(d))).json();
      const el = document.getElementById('who');
      if (r.name) {
        el.textContent = r.name;
        el.classList.remove('none');
        document.getElementById('name').value = r.name;
      } else {
        el.textContent = 'この時間に予約がありません';
        el.classList.add('none');
      }
    } catch (e) {
      document.getElementById('who').textContent = '取得できませんでした';
    }
  }

  function show(text, ok) {
    const m = document.getElementById('msg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'ng');
    m.style.display = 'block';
  }

  // その人の今日の体重を見に行く。体重計から入っていれば、それを使う（打たせない）
  let autoWeight = null;
  let autoSource = '';
  async function loadToday() {
    const name = document.getElementById('name').value.trim();
    const date = document.getElementById('date').value;
    const val = document.getElementById('autoval');
    if (!name) { val.textContent = '名前が決まっていません'; val.className = 'autoval waiting'; return; }
    try {
      const rows = await (await fetch(GAS_URL + '?action=gym_weight&name=' + encodeURIComponent(name))).json();
      const today = rows.filter(r => r.date === date).pop();
      if (today && today.weight) {
        autoWeight = Number(today.weight);
        autoSource = today.source || '';
        val.textContent = autoWeight.toFixed(2) + ' kg';
        val.className = 'autoval';
        document.getElementById('autolabel').textContent =
          '今日の体重' + (autoSource ? '（' + autoSource + '）' : '');
      } else {
        autoWeight = null;
        val.textContent = 'まだ届いていません（乗ってもらってください）';
        val.className = 'autoval waiting';
      }
    } catch (e) {
      val.textContent = '取得できませんでした';
      val.className = 'autoval waiting';
    }
  }

  document.getElementById('reload').onclick = loadToday;

  document.getElementById('save').onclick = async function () {
    const name = document.getElementById('name').value.trim();
    const date = document.getElementById('date').value;
    const typed = parseFloat(document.getElementById('weight').value);
    // 打った値があればそれが優先。無ければ体重計から来た値を、印ごと残す
    const weight = typed || autoWeight;
    const waist = parseFloat(document.getElementById('waist').value);
    if (!name || !date) { show('名前と日付を入れてください', false); return; }
    if (!weight) { show('体重がまだ届いていません。「手で入れる」から打つこともできます', false); return; }
    this.disabled = true;
    try {
      const body = { action: 'saveGymWeight', name, date, weight };
      // 手で打った時だけ印を付け替える。自動で入った行の「体重計」を消さない
      if (typed) body.source = '手入力';
      if (waist) body.waist = waist;
      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) });
      show(name + '　' + weight + 'kg' + (waist ? ' / ' + waist + 'cm' : '') + ' を保存しました', true);
      document.getElementById('waist').value = '';
      loadRecent(name);
      loadToday();
    } catch (e) {
      show('保存できませんでした', false);
    }
    this.disabled = false;
  };

  // 入れた直後に、その人の直近が見えると打ち間違いに気づける
  async function loadRecent(name) {
    if (!name) return;
    try {
      const rows = await (await fetch(GAS_URL + '?action=gym_weight&name=' + encodeURIComponent(name))).json();
      document.getElementById('recent').innerHTML = rows.slice(-5).reverse()
        .map(r => r.date.replace(/-/g, '/') + '　<b>' + r.weight + 'kg</b>' + (r.waist ? '　' + r.waist + 'cm' : ''))
        .join('<br>') || '—';
    } catch (e) { /* 表示だけなので黙って諦める */ }
  }

  // 名前の候補は宿題シートから。予約が無い人・時間がずれた人でも選ぶだけで入る
  async function loadNames() {
    try {
      const rows = await (await fetch(GAS_URL + '?action=admin_homework')).json();
      document.getElementById('names').innerHTML =
        rows.map(r => '<option value="' + r.name + '">').join('');
    } catch (e) { /* 候補が出なくても手で打てる */ }
  }

  loadNames();
  whoNow().then(() => {
    const name = document.getElementById('name').value;
    loadRecent(name);
    loadToday();
  });
  // 開いたまま待てるように。乗ってもらった数秒後に、自分で気づいて表示が変わる
  setInterval(function () { if (!autoWeight) loadToday(); }, 20000);
</script>
</body>
</html>
